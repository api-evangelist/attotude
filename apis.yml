aid: attotude
name: Attotude
description: >-
  AttoTude is a semiconductor and data-center infrastructure company building the
  first wired terahertz (THz) interconnect for AI and hyperscale networking. Its
  platform pairs the AttoEngine, an ASIC-based THz radio built on standard CMOS
  manufacturing, with AttoWire, a low-loss dielectric waveguide that carries
  200/400/800 Gbit/s per lane over reaches up to roughly 40 meters, delivering the
  bandwidth density of optics without the cost, power, and complexity of photonics.
  Founded to relieve the interconnect bottleneck in everything-to-everything AI
  clusters, the company has raised roughly $143M across seed, Series A, Series B,
  and Series C rounds. This is a hardware company with no public API, developer
  portal, or SDK; the profile below is enriched only with the identity and
  domain-security facts the pipeline could verify.
